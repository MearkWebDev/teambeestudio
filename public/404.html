<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Team Bee Creative Studios</title>
    <script>
      // SPA deep-link fallback (rafgraph/spa-github-pages).
      // Only used by hosts that serve 404.html for unknown paths (GitHub Pages).
      // On Apache/Hostinger the .htaccess rewrite serves index.html directly and
      // this file is never reached.
      //
      // pathSegmentsToKeep is derived from the deployment:
      //   - github.io project pages  -> 1  (/teambeestudio/...)
      //   - custom domain / apex     -> 0  (/...)
      (function () {
        var l = window.location;
        var pathSegmentsToKeep = /(^|\.)github\.io$/.test(l.hostname) ? 1 : 0;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      }());
    </script>
  </head>
  <body></body>
</html>
